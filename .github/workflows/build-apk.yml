name: Build Android APK

# Runs by itself whenever you upload files, or press "Run workflow" on the Actions tab.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      - name: Gather the web files into www/
        run: |
          mkdir -p www
          cp ./*.html ./*.js ./*.css ./*.webmanifest www/
          [ -d icons ] && cp -r icons www/icons || true

      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build the APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: aquafarm-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
